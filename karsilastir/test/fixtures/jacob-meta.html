<!doctype html>
<html>
  <body>
    <!-- Küçültülmüş, elle yazılmış örnek: jacob.de tarzı Shopware, meta itemprop gtin13 / mpn. -->
    <div itemscope itemtype="https://schema.org/Product">
      <meta itemprop="name" content="Brother TN-248VAL Toner Multipack" />
      <meta itemprop="brand" content="Brother" />
      <meta itemprop="gtin13" content="4977766771146" />
      <meta itemprop="mpn" content="TN-248VAL" />
      <div itemprop="offers" itemscope itemtype="https://schema.org/Offer">
        <meta itemprop="priceCurrency" content="EUR" />
        <meta itemprop="price" content="159.34" />
        <link itemprop="availability" href="https://schema.org/OutOfStock" />
      </div>
    </div>
  </body>
</html>
